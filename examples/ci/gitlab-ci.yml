# Example GitLab CI configuration for a repository whose database design lives in
# db-design.json.
#
# Copy the contents into your .gitlab-ci.yml and adjust JJF_VERSION and DESIGN.
# The generated workbook is kept as a job artifact and must NOT be committed: put
# *.xlsx in .gitignore, because the JSON is the source of truth and the workbook
# is a derived artifact.

stages:
  - validate
  - export

variables:
  JJF_VERSION: "v0.1.0"
  DESIGN: "db-design.json"

# alpine is enough because jjf is a static binary built with CGO_ENABLED=0: it
# needs no glibc and no runtime dependencies.
#
# install.sh is the installation method the README documents. It is POSIX sh and
# runs under busybox ash, checks the archive's sha256 against the release's
# checksums.txt, and writes exactly one file into --dir. --version pins the
# release, so the pipeline does not start installing a new one on its own. curl is
# the only thing the image is missing; tar and sha256sum come from busybox.
#
# The script itself is served from the default branch and can be changed there. A
# pipeline that needs a URL nobody can move should take the release archive
# directly instead; docs/install.md describes both.
.jjf:
  image: alpine:3.22
  before_script:
    - apk add --no-cache curl
    - curl -fsSL https://raw.githubusercontent.com/shutx-net/jumping-json-flush/main/install.sh
      | sh -s -- --version "$JJF_VERSION" --dir /usr/local/bin
    - jjf version

# 1. Detect changes to the design document with rules:changes.
# 2. Validate it.
# 3. A violation fails the pipeline: jjf exits 3 on a schema violation and 2 on
#    malformed input or a missing file, so no extra scripting is needed.
validate design:
  extends: .jjf
  stage: validate
  rules:
    - changes:
        - db-design.json
        - .gitlab-ci.yml
  script:
    - jjf validate "$DESIGN"

# 4. Generate the Excel design document.
# 5. Keep it as a job artifact instead of committing it.
export design:
  extends: .jjf
  stage: export
  needs: ["validate design"]
  rules:
    - changes:
        - db-design.json
        - .gitlab-ci.yml
  script:
    - mkdir -p build
    - jjf export xlsx "$DESIGN" -o build/db-design.xlsx
  artifacts:
    name: "db-design-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/db-design.xlsx
    expire_in: 30 days
