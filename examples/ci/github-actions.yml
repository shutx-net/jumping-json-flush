# Example GitHub Actions workflow for a repository whose database design lives in
# db-design.json.
#
# Copy this file to .github/workflows/db-design.yml in your own repository and
# adjust JJF_VERSION and DESIGN. The generated workbook is uploaded as a build
# artifact and must NOT be committed: put *.xlsx in .gitignore, because the JSON
# is the source of truth and the workbook is a derived artifact.

name: DB design

# 1. Detect changes to the design document. Nothing else in the repository can
#    change the design, so there is no reason to run on every push.
on:
  push:
    paths:
      - 'db-design.json'
      - '.github/workflows/db-design.yml'
  pull_request:
    paths:
      - 'db-design.json'
      - '.github/workflows/db-design.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  JJF_VERSION: v0.1.0
  DESIGN: db-design.json

jobs:
  db-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # install.sh is the installation method the README documents. It picks the
      # archive for the runner, checks its sha256 against the release's
      # checksums.txt, and writes exactly one file into --dir. --version pins the
      # release, so the pipeline does not start installing a new one on its own.
      #
      # The script itself is served from the default branch and can be changed
      # there. A pipeline that needs a URL nobody can move should take the release
      # archive directly instead; docs/install.md describes both.
      - name: install jjf
        run: |
          curl -fsSL https://raw.githubusercontent.com/shutx-net/jumping-json-flush/main/install.sh |
            sh -s -- --version "$JJF_VERSION" --dir "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/jjf" version

      # 2. Validate the design document.
      # 3. A failure fails the job: jjf exits 3 on a schema violation and 2 on
      #    malformed input or a missing file, so no extra scripting is needed.
      - name: validate
        run: jjf validate "$DESIGN"

      # 4. Generate the Excel design document.
      - name: export
        run: |
          mkdir -p build
          jjf export xlsx "$DESIGN" -o build/db-design.xlsx

      # 5. Keep the workbook as a CI artifact instead of committing it.
      - uses: actions/upload-artifact@v4
        with:
          name: db-design-xlsx
          path: build/db-design.xlsx
          if-no-files-found: error
