name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # The go directive of go.mod is the single source of the Go version.
          go-version-file: go.mod

      - name: gofmt
        # gofmt -l lists unformatted files and still exits 0, so the list itself
        # has to be the gate.
        run: |
          test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test (race detector, coverage)
        # The race detector requires cgo, so CGO_ENABLED must keep its default of
        # 1 here. Only the distributed binaries are built with CGO_ENABLED=0.
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: staticcheck
        # Run the linter with a version suffix instead of adding it to go.mod:
        # `go get -tool` would pull in six indirect dependencies and raise the go
        # directive, which the project's minimal-dependency policy forbids.
        #
        # This step carried GOTOOLCHAIN=auto while jjf targeted 1.24: staticcheck
        # 2026.1 is honnef.co/go/tools v0.7.0, whose go.mod requires go >= 1.25.0,
        # so the run needed a toolchain newer than the one go.mod named. The
        # toolchain directive now names 1.26.7, which already satisfies that, and
        # the override is gone with it. Every job in this file runs the toolchain
        # go.mod names and nothing else, which is what the rest of it already
        # wanted. A future staticcheck needing more than the pinned toolchain
        # fails loudly with "requires go >= x.y.z" instead of drifting onto some
        # other version.
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...

  metaschema:
    name: metaschema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: validate the schema against Draft 2020-12
        # internal/schema no longer compiles the schema with a JSON Schema
        # library, and the one thing that library did besides validating
        # documents - holding the schema itself to its meta-schema - left with
        # it. This job is where that check now lives, and it catches what a
        # struct decoder cannot: a `required` written as a string, or a
        # `minLength` written as a float, decode into the wrong field or fail
        # with a message about Go types rather than about JSON Schema.
        #
        # Run from a module path with a version suffix, like the staticcheck job
        # above and for the same reason: `go get -tool` would put it in go.mod,
        # and go.mod having no requires at all is the point of the change this
        # job accompanies. jv is a module of its own, tagged cmd/jv/vX.Y.Z, and
        # is not the library that was removed.
        #
        # The URL is an identifier and not a fetch: jv carries the 2020-12
        # meta-schema itself, so the only thing downloaded here is the tool.
        run: |
          go run github.com/santhosh-tekuri/jsonschema/cmd/jv@v0.7.0 \
            https://json-schema.org/draft/2020-12/schema \
            schema/db-design.schema.json

  crossbuild:
    name: crossbuild (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      # One broken target must not hide the state of the other four.
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: build
        # The artifact is thrown away: this job only answers whether the target
        # still compiles without cgo.
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/jjf

  selfcheck:
    name: selfcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: build jjf
        # A built binary, not `go run`: `go run` reports its own exit status and
        # would hide the exit codes this job asserts.
        run: go build -o "${RUNNER_TEMP}/jjf" ./cmd/jjf

      - name: validate and export the shipped example
        env:
          JJF: ${{ runner.temp }}/jjf
        run: |
          # This job wires the whole tool together on a real document: schema
          # validation, decoding, and xlsx generation. It also pins the exit code
          # contract, which is what callers build their own CI on.
          failures=0

          # expect <want-code> <label> <command...>
          #
          # The status is collected with "|| status=$?" rather than a bare "$?":
          # this step runs under "bash -e", where a plain assignment from a
          # failing command substitution aborts the whole script, and half of
          # these expectations are non-zero exit codes on purpose.
          expect() {
            local want="$1" label="$2"
            shift 2
            local out status=0
            out="$("$@" 2>&1)" || status=$?
            if [ "$status" -ne "$want" ]; then
              echo "::error::${label}: exit ${status}, want ${want}"
              printf '%s\n' "$out"
              failures=$((failures + 1))
              return
            fi
            echo "ok  ${label} (exit ${status})"
          }

          mkdir -p dist

          expect 0 "version" "$JJF" version
          "$JJF" version

          expect 0 "validate the example" \
            "$JJF" validate examples/db-design.example.json
          expect 0 "export the example" \
            "$JJF" export xlsx examples/db-design.example.json -o dist/db-design.xlsx

          # A schema violation is exit 3 and nothing else; a missing file, an
          # unknown format and a rejected formatVersion are exit 2.
          expect 3 "schema violation is exit 3" \
            "$JJF" validate cmd/jjf/testdata/schema_violation.json
          expect 2 "missing input is exit 2" \
            "$JJF" validate does/not/exist.json
          expect 2 "malformed json is exit 2" \
            "$JJF" validate cmd/jjf/testdata/broken.json
          expect 2 "unsupported format is exit 2" \
            "$JJF" export markdown examples/db-design.example.json -o dist/x.md
          expect 2 "unsupported formatVersion is exit 2" \
            "$JJF" validate cmd/jjf/testdata/future_version.json

          # The workbook has to be a real zip package.
          if [ ! -s dist/db-design.xlsx ]; then
            echo "::error::dist/db-design.xlsx is missing or empty"
            failures=$((failures + 1))
          elif [ "$(head -c 2 dist/db-design.xlsx)" != "PK" ]; then
            echo "::error::dist/db-design.xlsx is not a zip package"
            failures=$((failures + 1))
          else
            echo "ok  workbook is a zip package ($(wc -c < dist/db-design.xlsx) bytes)"
          fi

          # Byte determinism: exporting the same document twice must agree. This
          # needs no Excel reader, which is why it is the check that runs in CI.
          "$JJF" export xlsx examples/db-design.example.json -o dist/again.xlsx >/dev/null
          if ! cmp -s dist/db-design.xlsx dist/again.xlsx; then
            echo "::error::two exports of the same document differ"
            failures=$((failures + 1))
          else
            echo "ok  two exports are byte identical ($(sha256sum < dist/db-design.xlsx))"
          fi
          rm -f dist/again.xlsx

          # Without -o the workbook lands beside the input, with the extension
          # replaced.
          cp examples/db-design.example.json "${RUNNER_TEMP}/default-path.json"
          "$JJF" export xlsx "${RUNNER_TEMP}/default-path.json" >/dev/null
          if [ ! -s "${RUNNER_TEMP}/default-path.xlsx" ]; then
            echo "::error::export without -o did not write default-path.xlsx"
            failures=$((failures + 1))
          else
            echo "ok  export without -o writes <input>.xlsx"
          fi

          # A failed export leaves nothing behind.
          if [ -e dist/x.md ]; then
            echo "::error::a rejected export still created an output file"
            failures=$((failures + 1))
          fi

          # The dot format. Everything below checks the generated DOT
          # STRUCTURALLY and never runs graphviz: requiring the dot binary would
          # put a runtime dependency into the CI of a tool that refuses to have
          # one. Turning a .dot into an image is the reader's own step.
          expect 0 "export the example as dot" \
            "$JJF" export dot examples/db-design.example.json -o dist/er.dot
          if [ ! -s dist/er.dot ]; then
            echo "::error::dist/er.dot is missing or empty"
            failures=$((failures + 1))
          elif [ "$(head -1 dist/er.dot)" != "// Generated by jjf from a database design document." ]; then
            echo "::error::dist/er.dot does not open with the generated-by comment"
            failures=$((failures + 1))
          elif ! grep -q '^digraph ' dist/er.dot; then
            echo "::error::dist/er.dot has no digraph statement"
            failures=$((failures + 1))
          else
            echo "ok  dot output is a digraph ($(wc -c < dist/er.dot) bytes)"
          fi

          "$JJF" export dot examples/db-design.example.json -o dist/er-again.dot >/dev/null
          if ! cmp -s dist/er.dot dist/er-again.dot; then
            echo "::error::two dot exports of the same document differ"
            failures=$((failures + 1))
          else
            echo "ok  two dot exports are byte identical"
          fi
          rm -f dist/er-again.dot

          # "-o -" writes the same bytes as "-o <file>". Standard output is a
          # pipe or a file here and never a terminal, so the fact that dot - and
          # only dot - may be written to a terminal cannot be exercised in CI;
          # TestRunExportDotAllowsATerminal covers it.
          "$JJF" export dot examples/db-design.example.json -o - > dist/er-stdout.dot
          if ! cmp -s dist/er.dot dist/er-stdout.dot; then
            echo "::error::dot to standard output differs from dot to a file"
            failures=$((failures + 1))
          else
            echo "ok  dot to standard output matches dot to a file"
          fi

          "$JJF" export dot "${RUNNER_TEMP}/default-path.json" >/dev/null
          if [ ! -s "${RUNNER_TEMP}/default-path.dot" ]; then
            echo "::error::export dot without -o did not write default-path.dot"
            failures=$((failures + 1))
          else
            echo "ok  export dot without -o writes <input>.dot"
          fi

          # The svg format. Everything below checks the generated SVG
          # STRUCTURALLY and never runs a renderer, for the same reason the dot
          # block above never runs graphviz: requiring one would put a runtime
          # dependency into the CI of a tool that refuses to have one. The
          # argument is stronger here than it is for dot, because
          # internal/export/svg's own tests already read the output back with
          # encoding/xml and assert ten statements about the geometry. What
          # this block adds is the one thing those tests cannot reach: the
          # end-to-end path through a built binary, a real file on disk, and a
          # second run compared byte for byte.
          expect 0 "export the example as svg" \
            "$JJF" export svg examples/db-design.example.json -o dist/er.svg
          if [ ! -s dist/er.svg ]; then
            echo "::error::dist/er.svg is missing or empty"
            failures=$((failures + 1))
          elif [ "$(head -1 dist/er.svg)" != '<?xml version="1.0" encoding="UTF-8"?>' ]; then
            echo "::error::dist/er.svg does not open with the XML declaration"
            failures=$((failures + 1))
          elif ! grep -q '<svg ' dist/er.svg; then
            echo "::error::dist/er.svg has no svg element"
            failures=$((failures + 1))
          else
            echo "ok  svg output is an svg document ($(wc -c < dist/er.svg) bytes)"
          fi

          "$JJF" export svg examples/db-design.example.json -o dist/er-again.svg >/dev/null
          if ! cmp -s dist/er.svg dist/er-again.svg; then
            echo "::error::two svg exports of the same document differ"
            failures=$((failures + 1))
          else
            echo "ok  two svg exports are byte identical"
          fi
          rm -f dist/er-again.svg

          # "-o -" writes the same bytes as "-o <file>". Standard output is a
          # pipe or a file here too, so svg being the second format that may go
          # to a terminal is covered by TestRunExportSVGAllowsATerminal rather
          # than by this job.
          "$JJF" export svg examples/db-design.example.json -o - > dist/er-stdout.svg
          if ! cmp -s dist/er.svg dist/er-stdout.svg; then
            echo "::error::svg to standard output differs from svg to a file"
            failures=$((failures + 1))
          else
            echo "ok  svg to standard output matches svg to a file"
          fi

          "$JJF" export svg "${RUNNER_TEMP}/default-path.json" >/dev/null
          if [ ! -s "${RUNNER_TEMP}/default-path.svg" ]; then
            echo "::error::export svg without -o did not write default-path.svg"
            failures=$((failures + 1))
          else
            echo "ok  export svg without -o writes <input>.svg"
          fi

          # The importer, on the committed pg_dump fixtures: a dump becomes a
          # document, the document validates, and the document exports.
          expect 0 "import the postgres fixture" \
            "$JJF" import postgres internal/importer/postgres/testdata/dump/pg16/ecshop.sql -o dist/imported.json
          expect 0 "validate the imported document" \
            "$JJF" validate dist/imported.json
          expect 0 "export the imported document" \
            "$JJF" export xlsx dist/imported.json -o dist/imported.xlsx
          # The whole pipeline, dump to JSON to diagram, in both diagram
          # formats.
          expect 0 "export the imported document as dot" \
            "$JJF" export dot dist/imported.json -o dist/imported.dot
          expect 0 "export the imported document as svg" \
            "$JJF" export svg dist/imported.json -o dist/imported.svg

          # A broken dump, a strict run with warnings, and an unknown dialect are
          # all exit 2.
          expect 2 "a broken dump is exit 2" \
            "$JJF" import postgres internal/importer/postgres/testdata/dump/synthetic/broken.sql -o dist/broken.json
          expect 2 "-strict on a dump with warnings is exit 2" \
            "$JJF" import postgres internal/importer/postgres/testdata/dump/pg16/edge.sql -strict -o dist/edge.json
          expect 2 "an unknown dialect is exit 2" \
            "$JJF" import mysql internal/importer/postgres/testdata/dump/pg16/ecshop.sql -o dist/nope.json

          # None of the three failures may leave an output file behind.
          for leftover in dist/broken.json dist/edge.json dist/nope.json; do
            if [ -e "$leftover" ]; then
              echo "::error::a rejected import still created ${leftover}"
              failures=$((failures + 1))
            fi
          done

          # Byte determinism again, this time for the importer.
          "$JJF" import postgres internal/importer/postgres/testdata/dump/pg16/ecshop.sql -o dist/imported-again.json >/dev/null
          if ! cmp -s dist/imported.json dist/imported-again.json; then
            echo "::error::two imports of the same dump differ"
            failures=$((failures + 1))
          else
            echo "ok  two imports are byte identical"
          fi
          rm -f dist/imported-again.json

          if [ "$failures" -ne 0 ]; then
            echo "::error::${failures} selfcheck(s) failed"
            exit 1
          fi
          echo "selfcheck passed"

      - uses: actions/upload-artifact@v7
        with:
          name: db-design-xlsx
          path: dist/db-design.xlsx
          if-no-files-found: error

  installer:
    name: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        # install.sh is POSIX sh, not bash: the README tells people to pipe it
        # into sh, and the alpine images jjf advertises have no bash to fall back
        # on. It is linted as sh for that reason. shellcheck ships on the runner.
        run: shellcheck --shell=sh install.sh

      - name: installer contract
        # The download paths need a published release and are not exercised here.
        # What this pins is everything around them: the usage errors, the tag gate
        # that keeps a path out of a download URL, and the promise that a
        # truncated download does nothing.
        run: |
          failures=0

          # expect <want-code> <label> <command...>, the same helper the selfcheck
          # job uses and for the same reason: half of these are non-zero exit
          # codes on purpose, under a shell that runs with -e.
          expect() {
            local want="$1" label="$2"
            shift 2
            local out status=0
            out="$("$@" 2>&1)" || status=$?
            if [ "$status" -ne "$want" ]; then
              echo "::error::${label}: exit ${status}, want ${want}"
              printf '%s\n' "$out"
              failures=$((failures + 1))
              return
            fi
            echo "ok  ${label} (exit ${status})"
          }

          expect 0 "--help" sh install.sh --help
          expect 2 "an unknown option is exit 2" sh install.sh --nope
          expect 2 "--version without a tag is exit 2" sh install.sh --version
          expect 2 "--dir without a path is exit 2" sh install.sh --dir
          expect 1 "a tag that is not a release version is refused" \
            sh install.sh --version ../../etc --dir "${RUNNER_TEMP}/nowhere"

          # A pipe can deliver half a script, and half a script must do nothing.
          # Every prefix is fed to sh the way curl would; a "==>" in the output is
          # the installer having started work.
          target="${RUNNER_TEMP}/truncated"
          for n in 512 1024 2048 4096 8192; do
            out="$(head -c "$n" install.sh | sh -s -- --dir "$target" 2>/dev/null || true)"
            if printf '%s' "$out" | grep -q '==>'; then
              echo "::error::a ${n} byte prefix of install.sh started doing work"
              failures=$((failures + 1))
            fi
          done
          if [ -e "$target" ]; then
            echo "::error::a truncated install.sh created ${target}"
            failures=$((failures + 1))
          fi
          echo "ok  every truncated prefix is inert"

          if [ "$failures" -ne 0 ]; then
            echo "::error::${failures} installer check(s) failed"
            exit 1
          fi
          echo "installer checks passed"

  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The action enables the nix-command and flakes features on its own, and
      # points nix at this workflow's GITHUB_TOKEN, so fetching the flake input
      # is not subject to the anonymous API rate limit.
      - uses: cachix/install-nix-action@v31

      - name: nix flake check
        # checks.jjf is the flake's package, and its check phase is
        # `go test ./...`, so this job repeats the test job inside the nix
        # sandbox. What it adds is the dependency gate: the flake declares that
        # there is nothing to vendor and a nix build has no network, so the
        # first `require` anyone adds to go.mod fails here. It is what holds the
        # README to its word.
        run: nix flake check --print-build-logs
