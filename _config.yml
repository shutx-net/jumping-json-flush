# GitHub Pages configuration.
#
# The site is built by GitHub itself from the default branch: Settings -> Pages,
# "Deploy from a branch", main / (root). There is no build step here and no
# workflow, which is the whole point of this file being the only thing needed.
#
# The source is the repository root and not /docs, because every document under
# docs/ links back to ../README.md. A site rooted at docs/ would leave that link,
# and the README itself, outside the site.
#
# Nothing here adds front matter to any markdown file. GitHub Pages enables nine
# Jekyll plugins that cannot be turned off, and four of them are exactly what lets
# these documents be published as they are:
#
#   jekyll-optional-front-matter  a markdown file needs no front matter to become
#                                 a page, so the sources stay clean on github.com
#   jekyll-readme-index           README.md becomes the index of its directory
#   jekyll-titles-from-headings   the leading # becomes the page title
#   jekyll-relative-links         [x](docs/usage.md) is rewritten to .html
#
# The last one is why the existing relative links keep working, on the site and on
# github.com both, with no second set of URLs to maintain.

title: Jumpin' Json Flush
description: >-
  Manage database design specifications as JSON and generate Excel design
  documents.

# GitHub's own markdown styling, so a page reads the same here as it does in the
# repository.
theme: jekyll-theme-primer

# Jekyll copies anything it is not told to skip, and this repository is mostly Go.
# Directories and files whose name starts with a dot are skipped already, which
# covers .github/, .devcontainer/ and .claude-plugin/.
#
# Everything a published document links to has to stay off this list.
# pages_test.go is what enforces that.
exclude:
  - cmd/
  - internal/
  - "*.go"
  - "**/*.go"
  - go.mod
  - go.sum
  - flake.nix
  - flake.lock
  - AGENTS.md
  - CLAUDE.md

# Both of these plugins keep the markdown file around beside the page they made
# from it, which would put every document on the site twice: once rendered and
# once as raw source. Only the rendered page is linked, so the original goes.
optional_front_matter:
  remove_originals: true
readme_index:
  remove_originals: true
